<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise for You ❤️</title>
  <style>
    * { box-sizing: border-box; font-family: 'Sukhumvit Set', 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #4a4a4a;
      overflow-x: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-bottom: 25px;
      position: relative;
    }

    h1 { color: #ff4b72; margin-bottom: 10px; }
    p { font-size: 1.1rem; color: #666; }

    /* --- Feature 1: Playful Dodge Button --- */
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      min-height: 80px;
      position: relative;
    }

    .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, font-size 0.2s;
    }

    .btn-yes { background-color: #ff4b72; color: white; box-shadow: 0 4px 10px rgba(255,75,114,0.3); }
    .btn-no { background-color: #e0e0e0; color: #666; position: absolute; transition: all 0.2s ease; }

    /* --- Feature 2: Scratch Card --- */
    .scratch-container {
      position: relative;
      width: 280px;
      height: 140px;
      margin: 20px auto;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .scratch-secret {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #fff0f3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed #ff4b72;
      border-radius: 15px;
    }

    .scratch-secret h3 { color: #ff4b72; margin: 0 0 5px 0; }
    .scratch-secret p { margin: 0; font-size: 0.95rem; font-weight: bold; }

    canvas#scratchCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      cursor: pointer;
      z-index: 2;
    }

    /* --- Feature 3: Cursor Heart Particle --- */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      color: #ff4b72;
      font-size: 20px;
      animation: floatUp 1s ease-out forwards;
      z-index: 999;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -100px) scale(1.5); }
    }
  </style>
</head>
<body>

  <!-- Card 1: Interactive Question -->
  <div class="container">
    <h1>ถามจริงนิดนึง... ❤️</h1>
    <p>รักเค้าไหมครับ?</p>
    
    <div class="btn-group" id="btnGroup">
      <button class="btn btn-yes" id="yesBtn" onclick="sayYes()">รักที่สุด!</button>
      <button class="btn btn-no" id="noBtn" onmouseover="dodge()" onclick="dodge()">ไม่รัก</button>
    </div>
  </div>

  <!-- Card 2: Scratch Card Coupon -->
  <div class="container">
    <h1>ขูดลุ้นรางวัลพิเศษ 🎁</h1>
    <p>ใช้นิ้วหรือเมาส์ขูดเพื่อเปิดกล่องของขวัญ!</p>
    
    <div class="scratch-container">
      <div class="scratch-secret">
        <h3>🎟️ คูปองตามใจแฟน 1 วัน!</h3>
        <p>(ใช้สั่งอะไรก็ได้ ห้ามขัดขืน 100%)</p>
      </div>
      <canvas id="scratchCanvas" width="280" height="140"></canvas>
    </div>
  </div>

  <script>
    // --- Feature 1: Dodge Button Logic ---
    let yesScale = 1;
    function dodge() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const container = document.getElementById('btnGroup');

      // Random position inside the container area
      const maxX = container.clientWidth - noBtn.clientWidth;
      const maxY = container.clientHeight - noBtn.clientHeight;
      
      const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
      const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

      // Make YES button larger every time NO is attempted
      yesScale += 0.2;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    function sayYes() {
      alert("รู้อยู่แล้วว่าต้องตอบรัก! 🥰❤️");
    }

    // --- Feature 2: Scratch Card Canvas Logic ---
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');

    // Fill silver cover
    ctx.fillStyle = '#c5c5c5';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#666';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('✨ ขูดตรงนี้เลย ✨', canvas.width / 2, canvas.height / 2 + 5);

    let isScratching = false;

    function scratch(e) {
      if (!isScratching) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('mousedown', () => isScratching = true);
    canvas.addEventListener('mouseup', () => isScratching = false);
    canvas.addEventListener('mousemove', scratch);

    canvas.addEventListener('touchstart', () => isScratching = true);
    canvas.addEventListener('touchend', () => isScratching = false);
    canvas.addEventListener('touchmove', scratch);

    // --- Feature 3: Cursor Heart Trail ---
    document.addEventListener('mousemove', function(e) {
      // Spawn heart every few movements
      if (Math.random() > 0.3) return; 

      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerHTML = '❤️';
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    });
  </script>
</body>
</html>
